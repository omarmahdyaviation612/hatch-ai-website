<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hatch.Ai — Marketing Dashboard Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0e1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #0a0e1a 0%, #0d1b2a 50%, #0a0e1a 100%);
    }
    .bg-orb {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.15; animation: float 8s ease-in-out infinite;
    }
    .orb1 { width: 500px; height: 500px; background: #4ECDC4; top: -100px; left: -100px; animation-delay: 0s; }
    .orb2 { width: 400px; height: 400px; background: #6C63FF; bottom: -80px; right: -80px; animation-delay: 3s; }
    .orb3 { width: 300px; height: 300px; background: #4ECDC4; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: 6s; }
    @keyframes float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }

    /* Card */
    .card {
      position: relative; z-index: 1;
      background: rgba(26, 29, 46, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(78, 205, 196, 0.2);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    }

    /* Logo */
    .logo-section { text-align: center; margin-bottom: 36px; }
    .logo {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 28px; font-weight: 800; color: #fff;
      letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, #4ECDC4, #6C63FF);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .logo-dot { color: #4ECDC4; }
    .subtitle { color: #8892b0; font-size: 14px; margin-top: 8px; }

    /* Form */
    h2 { font-size: 20px; font-weight: 600; color: #e8eaf6; margin-bottom: 6px; }
    .form-desc { color: #8892b0; font-size: 13px; margin-bottom: 28px; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: #8892b0; margin-bottom: 8px; font-weight: 500; }

    .input-wrapper { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: #8892b0; font-size: 15px;
    }
    input {
      width: 100%;
      background: rgba(37, 40, 64, 0.8);
      border: 1px solid rgba(78, 205, 196, 0.15);
      color: #e8eaf6;
      padding: 13px 14px 13px 42px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    input:focus { border-color: #4ECDC4; background: rgba(37, 40, 64, 1); box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.1); }
    input::placeholder { color: #4a5173; }

    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      cursor: pointer; color: #8892b0; font-size: 14px; transition: color 0.2s;
    }
    .toggle-pw:hover { color: #4ECDC4; }

    /* Error */
    .error-msg {
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid rgba(255, 82, 82, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #ff5252;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Button */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4ECDC4, #6C63FF);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      margin-top: 8px;
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(78, 205, 196, 0.3); }
    .btn-login:active { transform: translateY(0); }

    /* Footer */
    .card-footer { margin-top: 28px; text-align: center; }
    .card-footer p { font-size: 12px; color: #4a5173; }
    .card-footer a { color: #4ECDC4; text-decoration: none; }

    /* Powered by */
    .powered { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #2d3154; z-index: 1; }

    /* Loading state */
    .btn-login.loading { opacity: 0.7; pointer-events: none; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="bg">
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>
</div>

<div class="card">
  <div class="logo-section">
    <div class="logo">
      <div class="logo-icon">🚀</div>
      <span>Hatch<span class="logo-dot">.Ai</span></span>
    </div>
    <div class="subtitle">Marketing Command Center</div>
  </div>

  <h2>Welcome back 👋</h2>
  <p class="form-desc">Sign in to manage your social media pages</p>

  <!-- Error message if login failed -->
  <div id="error-msg" class="error-msg" style="display:none">
    <i class="fas fa-exclamation-circle"></i>
    <span id="error-text">Invalid username or password</span>
  </div>

  <form action="/login" method="POST" id="login-form" onsubmit="handleSubmit(this)">
    <div class="form-group">
      <label for="username"><i class="fas fa-user" style="margin-right:6px"></i>Username</label>
      <div class="input-wrapper">
        <i class="fas fa-user input-icon"></i>
        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username"/>
      </div>
    </div>

    <div class="form-group">
      <label for="password"><i class="fas fa-lock" style="margin-right:6px"></i>Password</label>
      <div class="input-wrapper">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password"/>
        <span class="toggle-pw" onclick="togglePw()"><i class="fas fa-eye" id="pw-icon"></i></span>
      </div>
    </div>

    <button type="submit" class="btn-login" id="login-btn">
      <i class="fas fa-sign-in-alt"></i> Sign In to Dashboard
    </button>
  </form>

  <div class="card-footer">
    <p>🔒 Secured access — <a href="mailto:contact@hatchai.net">contact@hatchai.net</a></p>
  </div>
</div>

<div class="powered">Powered by Hatch.Ai © 2024</div>

<script>
  // Show error from URL param
  const params = new URLSearchParams(window.location.search);
  if (params.get('error')) {
    document.getElementById('error-msg').style.display = 'flex';
    document.getElementById('error-text').textContent = decodeURIComponent(params.get('error'));
  }

  function togglePw() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    if (pw.type === 'password') { pw.type = 'text'; icon.className = 'fas fa-eye-slash'; }
    else { pw.type = 'password'; icon.className = 'fas fa-eye'; }
  }

  function handleSubmit(form) {
    const btn = document.getElementById('login-btn');
    btn.innerHTML = '<div class="spinner"></div> Signing in...';
    btn.classList.add('loading');
  }
</script>
</body>
</html>
